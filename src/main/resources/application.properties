spring.application.name=patelsamaj-backend
server.port=${PORT}

spring.main.lazy-initialization=true

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.jpa.hibernate.ddl-auto=update

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRE}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRE}
jwt.cookie-name=${JWT_COOKIE_NAME}
jwt.cookie-path=${JWT_COOKIE_PATH}
jwt.cookie-secure=${JWT_COOKIE_SECURE}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE}

cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

#Email configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_SMTP}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#Hikari Configure
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
